<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四月的机械人偶工作室</title>
<style>
body {
  background:
    radial-gradient(ellipse at 20% 15%, rgba(89, 83, 160, .20), transparent 42%),
    radial-gradient(ellipse at 80% 65%, rgba(57, 86, 155, .18), transparent 45%),
    linear-gradient(180deg, #070b19 0%, #10162b 55%, #080c1b 100%);
  background-attachment: scroll;
  color: #8890bd;
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  min-height: 100vh;
  position: relative;
}
.container-fluid {
  max-width: 900px;
  margin: 0 auto;
  padding: 28px 22px 60px;
  box-sizing: border-box;
}
.story-shell {
  background: rgba(13, 19, 40, .88);
  border: 1px solid rgba(157, 169, 230, .22);
  border-radius: 14px;
  padding: 30px 34px;
  box-shadow: 0 8px 35px rgba(0, 0, 0, .25),
              0 0 30px rgba(91, 102, 190, .08);
}
.story-title {
  letter-spacing: .12em;
  text-align: center;
  margin: 8px 0 4px;
  color: #dce2ff;
}
.story-subtitle {
  text-align: center;
  color: #929dc9;
  font-size: 12px;
  letter-spacing: .18em;
  margin-bottom: 28px;
}
.scene-label {
  color: #aeb9ee;
  font-size: 12px;
  letter-spacing: .14em;
  border-bottom: 1px solid rgba(157, 169, 230, .24);
  padding-bottom: 9px;
  margin: 22px 0 18px;
}
p {
  line-height: 1.95;
  margin: 0 0 13px;
  color: #e2e5f5;
}
.dialogue {
  margin: 0 0 12px;
  line-height: 1.9;
  color: #e2e5f5;
}
.thought {
  font-style: italic;
  color: #a9b0ca;
}
.panel {
  background: rgba(48, 57, 94, .38);
  border-left: 3px solid #858fd0;
  padding: 14px 18px;
  margin: 18px 0;
  color: #e0e4fa;
}
.choice-card {
  background: rgba(34, 43, 75, .62);
  border: 1px solid rgba(145, 158, 220, .25);
  border-radius: 9px;
  padding: 16px;
  margin: 10px 0;
  color: #e2e5f5;
}
.btn {
  display: inline-block;
  border-radius: 7px;
  margin: 5px 5px 5px 0;
  white-space: normal;
  transition: background .2s ease, border-color .2s ease;
  cursor: pointer;
  padding: 8px 13px;
  font: inherit;
  line-height: 1.5;
}
.btn-primary {
  background: #505b94;
  border: 1px solid #6976b4;
  color: #ffffff;
}
.btn-primary:hover, .btn-primary:focus {
  background: #6876b5;
  border-color: #9aa7ee;
  color: #ffffff;
}
.btn-default {
  background: rgba(27, 35, 63, .9);
  border: 1px solid #59658f;
  color: #dce2ff;
}
.btn-default:hover, .btn-default:focus {
  background: #343f6c;
  border-color: #8795d6;
  color: #ffffff;
}
.status {
  color: #9ba7d4;
  font-size: 12px;
  letter-spacing: .08em;
}
hr {
  border: 0;
  border-top: 1px solid rgba(157, 169, 230, .22);
  margin: 24px 0;
}
input[type='text'] {
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  background: #11182e;
  color: #e8ebff;
  border: 1px solid #59658f;
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
}

.shop-sign {
  box-sizing: border-box;
  width: 100%;
  margin: 20px auto;
  padding: 22px 20px;
  color: #e8ebff;
  background: linear-gradient(145deg, #171d35, #11182e);
  border: 1px solid #59658f;
  border-radius: 4px;
  box-shadow:
    inset 0 0 0 4px rgba(154, 167, 238, 0.06),
    0 5px 16px rgba(0, 0, 0, 0.18);
}

.shop-sign-header {
  text-align: center;
}

.shop-sign-en,
.shop-sign-label {
  color: #aab5ed;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
}

.shop-sign-header h3 {
  margin: 10px 0;
  color: #f0e4c9;
  font-size: 1.25rem;
  letter-spacing: 0.08em;
}

.shop-sign-intro {
  min-height: 24px;
  line-height: 1.8;
}

.shop-sign-divider {
  height: 1px;
  margin: 16px 0;
  background: #59658f;
}

.shop-sign-business {
  min-height: 20px;
  line-height: 1.8;
}

.shop-sign-slogans {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 18px;
}

.shop-sign-label {
  margin-bottom: 4px;
}

.shop-sign-slogans textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 9px 10px;
  color: #e8ebff;
  background: rgba(10, 15, 31, 0.45);
  border: 1px solid #59658f;
  border-radius: 3px;
  font: inherit;
  line-height: 1.7;
  resize: vertical;
}

.shop-sign-slogans textarea:focus {
  border-color: #aab5ed;
  outline: none;
  box-shadow: 0 0 6px rgba(154, 167, 238, 0.2);
}

.shop-sign-slogans textarea::placeholder {
  color: #8992b5;
}

input[type='text']:focus {
  border-color: #9aa7ee;
  outline: none;
  box-shadow: 0 0 7px rgba(154, 167, 238, .25);
}
.form-control, .selectize-input, select {
  background: #11182e;
  color: #e2e5f5;
  border-color: #59658f;
}
.form-control:focus, select:focus {
  background: #11182e;
  color: #ffffff;
  border-color: #9aa7ee;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .55;
  background-image:
    radial-gradient(1px 1px at 10% 20%, #ffffff 99%, transparent),
    radial-gradient(1px 1px at 30% 75%, #c9d5ff 99%, transparent),
    radial-gradient(2px 2px at 55% 35%, #ffffff 99%, transparent),
    radial-gradient(1px 1px at 78% 18%, #d5d9ff 99%, transparent),
    radial-gradient(1px 1px at 90% 65%, #ffffff 99%, transparent),
    radial-gradient(2px 2px at 42% 50%, #aebcff 99%, transparent),
    radial-gradient(1px 1px at 68% 88%, #ffffff 99%, transparent);
  background-size: 350px 300px;
}
.container-fluid {
  position: relative;
  z-index: 1;
}

/* 原 Shiny 魔法弹窗的网页实现 */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
  background: radial-gradient(
    circle at 50% 45%,
    rgba(91, 54, 160, .62),
    rgba(20, 15, 43, .88) 75%
  );
}
.modal-dialog {
  width: min(520px, calc(100vw - 40px));
  margin: auto;
  animation: magicAppear .45s cubic-bezier(.2,.8,.2,1);
}
.modal-content {
  background:
    radial-gradient(circle at top right, rgba(224,211,255,.8), transparent 48%),
    linear-gradient(145deg, #fffdf8, #f0e9ff);
  color: #29213d;
  border: 1px solid #c6a6ff;
  border-radius: 18px;
  box-shadow:
    0 0 18px rgba(183,143,255,.4),
    0 0 55px rgba(117,75,220,.28),
    0 20px 65px rgba(0,0,0,.4);
  overflow: hidden;
}
.modal-header {
  border-bottom: 1px solid rgba(133,95,190,.25);
  padding: 22px 26px 16px;
}
.modal-title {
  color: #57349b;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.5;
  margin: 0;
}
.modal-body {
  padding: 24px 28px;
  color: #30213f;
  font-size: 16px;
  line-height: 1.9;
}
.modal-body p {
  color: #30213f;
  margin-bottom: 14px;
}
.modal-footer {
  padding: 16px 24px 22px;
  border-top: 1px solid rgba(133,95,190,.2);
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
}
.modal-footer .btn-primary {
  background: linear-gradient(135deg, #7952c8, #55339b);
  border: 1px solid #9b7ad8;
  border-radius: 8px;
  color: #ffffff;
  padding: 9px 20px;
  font-size: 15px;
}
.modal-footer .btn-default {
  background: #ffffff;
  color: #493663;
  border: 1px solid #c7b5e6;
  border-radius: 8px;
  padding: 9px 18px;
}
@keyframes magicAppear {
  from { opacity: 0; transform: scale(.12); }
  to { opacity: 1; transform: scale(1); }
}
@media (max-width: 600px) {
  .container-fluid { padding: 18px 12px 40px; }
  .story-shell { padding: 22px 18px; }
  .modal-backdrop { padding: 16px; }
  .modal-dialog { width: calc(100vw - 32px); }
  .modal-header { padding: 18px 20px 14px; }
  .modal-body { padding: 20px; font-size: 15px; }
}
button:focus-visible {
  outline: 2px solid #aab5ff;
  outline-offset: 2px;
}
.field-label {
  display: block;
  margin: 12px 0 6px;
  color: #cdd5ff;
}
.plant-option {
  display: block;
  padding: 7px 0;
}
.plant-option input {
  accent-color: #858fd0;
  margin-right: 8px;
}
.toast {
  position: fixed;
  z-index: 1200;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: #222b4b;
  color: #e2e5f5;
  border: 1px solid #8795d6;
  border-radius: 8px;
  padding: 12px 18px;
  box-shadow: 0 6px 24px #0006;
  max-width: calc(100vw - 32px);
}

/* 故事主容器 */
.story-shell {
  background: rgba(13, 19, 40, 0.94) !important;
  color: #e2e5f5;
}

/* 书架上的书籍选项 */
.choice-card {
  background: rgba(34, 43, 75, 0.82) !important;
  border: 1px solid rgba(145, 158, 220, 0.35);
  border-radius: 9px;
  color: #e2e5f5 !important;
}

/* 书籍标题和普通文字 */
.story-shell h1,
.story-shell h2,
.story-shell h3,
.story-shell h4,
.story-shell p,
.story-shell label {
  color: #e2e5f5;
}

/* 避免按钮或内容区域出现白色底色 */
.story-shell .btn-default {
  background: rgba(27, 35, 63, 0.95) !important;
  color: #dce2ff !important;
  border-color: #59658f;
}

.story-shell .btn-primary {
  background: #505b94 !important;
  color: #ffffff !important;
  border-color: #6976b4;
}
#utility-menu-button {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2000;
  padding: 9px 14px;
  border: 1px solid #8795d6;
  border-radius: 8px;
  background: #222b4b;
  color: white;
  cursor: pointer;
}

.utility-sidebar {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  max-width: 85vw;
  height: 100vh;
  overflow-y: auto;
  padding: 24px 18px;
  background: #151b30;
  color: #e2e5f5;
  border-right: 1px solid #8795d6;
  z-index: 1999;
  box-shadow: 4px 0 20px #0006;
}

.utility-sidebar.open {
  display: block;
}

.utility-sidebar input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  margin: 8px 0;
  padding: 9px;
}

/* 资料栏按钮统一样式 */
.utility-sidebar button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 8px 0;
  padding: 9px 12px;

  background: rgba(34, 43, 75, 0.9);
  color: #e2e5f5;
  border: 1px solid rgba(145, 158, 220, 0.45);
  border-radius: 8px;

  text-align: left;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.utility-sidebar button:hover,
.utility-sidebar button:focus {
  background: #343f6c;
  color: #ffffff;
  border-color: #8795d6;
}


/* ===== 书架弹层 ===== */
.bookshelf-overlay {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
  overflow-y: auto;
  background: rgba(3, 6, 18, 0.82);
}

.bookshelf-window {
  position: relative;
  width: 100%;
  max-width: 900px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 30px 34px;
  box-sizing: border-box;
  background: rgba(13, 19, 40, 0.98);
  border: 1px solid rgba(157, 169, 230, 0.35);
  border-radius: 14px;
  box-shadow: 0 12px 45px rgba(0, 0, 0, 0.55);
  color: #e2e5f5;
}

.bookshelf-window h4,
.bookshelf-window p {
  color: #e2e5f5;
}

.bookshelf-window .choice-card {
  background: rgba(34, 43, 75, 0.82);
  border: 1px solid rgba(145, 158, 220, 0.35);
  border-radius: 9px;
  padding: 16px;
}

.bookshelf-window .btn-default {
  background: rgba(27, 35, 63, 0.95);
  color: #dce2ff;
  border-color: #59658f;
}

.bookshelf-window .btn-primary {
  background: #505b94;
  color: #ffffff;
  border-color: #6976b4;
}

.bookshelf-close {
  position: sticky;
  top: 0;
  float: right;
  z-index: 2;
  padding: 7px 13px;
  border: 1px solid #8795d6;
  border-radius: 8px;
  background: #222b4b;
  color: white;
  cursor: pointer;
}

@media (max-width: 600px) {
  .bookshelf-overlay {
    padding: 12px;
  }

  .bookshelf-window {
    max-height: calc(100vh - 24px);
    padding: 22px 18px;
  }
}






</style>
</head>
<body>


<div id="utility-sidebar" class="utility-sidebar">

  <h3>角色资料</h3>

  <label for="rename-input">修改你的名字</label>
  <input id="rename-input" type="text" maxlength="80"
         placeholder="输入新名字">
  <button id="save-rename" type="button">保存名字</button>

  <hr>

  <h3>已收录书籍</h3>
  <div id="collected-books">
    <p>还没有读过任何书。</p>
  </div>

  <button id="back-to-bookshelf" class="btn btn-primary">书架</button>

  <button id="重新开始游戏" type="button">重新开始游戏</button>

</div>

<main class="container-fluid">
  <section class="story-shell">
    <h2 class="story-title">四月的机械人偶工作室</h2>
    <div class="story-subtitle">IV SYSTEM / INTERACTIVE EDITION</div>
    <div id="story"></div>
    <hr>
    <div class="status" id="status">阅读进度：初始启动</div>
  </section>
</main>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<button
  id="utility-menu-button"
  type="button"
  aria-expanded="false"
  aria-controls="utility-sidebar"
  style="display: none;"
>
  ☰ 资料栏
</button>

<script>
"use strict";

const openingHTML = `
<div class="scene-label">01 / 初始启动</div>
<p>你睁开了眼。</p>
<p>首先映入眼帘的是一张少女的脸。齐肩的短发从肩膀上方略微垂下。一双乌黑的眼睛平静地看着你，面上看不出什么表情。</p>
<p>看到你醒来，她什么也没说，退向身后，非常丝滑地躺到了地上。</p>
<p>她这副模样，不禁让你觉得有些可爱。</p>
<p>不过，你很快意识到自己正坐在地板上。好在有一层地毯隔绝了地面的寒冷。</p>
<p>视线环绕四周，身侧是一面落地窗。而这里看起来像是一家小型工作室。不远处还有一套桌椅，房间里的柜子上摆满了一些叫不出名字的、看起来奇形怪状的工具。墙边还有一段通往二楼的楼梯。</p>
<p>这时，你发现眼前凭空多出了一个奇怪的面板。</p>
<details class="panel">
  <summary><strong>查看任务板</strong></summary>
  <h4>MISSION / 主线任务</h4>
  <p><strong>任务名称：</strong>协助店长经营店铺</p>
  <p><strong>完成指标：</strong>店面建设度 100；业务完成数量 5</p>
  <p><strong>当前进度：</strong>建设度 0 / 100；业务 0 / 5</p>
</details>
<p class="thought">任务？我的吗？</p>
<p class="thought">完成了有什么奖励？不完成会怎么样？</p>
<p class="thought">这里没有别人，店长应该就是这个少女了吧。</p>
<p class="thought">至于店铺，难道是这里吗？暂时看不出是做什么的。看起来有点像五金店。</p>
<p class="thought">五金店？那是什么？</p>
<p class="thought">不对，我怎么没有任何记忆。我是谁？</p>
<p>你突然有些慌乱和不安。</p>
<p>就在这时，你面前的少女及时地坐起身来。</p>
<p class="dialogue"><strong>四月：</strong>你好，我是四月。你是完全由我组装的第一个人偶，代号 IV-01。</p>
<p class="dialogue"><strong>四月：</strong>不过组装完成后，你现在已经是一个独立的人偶了。或许你想给自己取个名字吗？</p>
<p>说着，她还轻微歪了下头，似乎有些不知道要怎么对待你。</p>
<div class="choice-card">
  <h4>IDENTITY / 角色命名</h4>
  <p>请选择初始称呼。你可以输入一个名字，也可以暂时使用代号 01。</p>
  <label class="field-label" for="name-input">你想给自己取什么名字？</label>
  <input type="text" id="name-input" placeholder="输入名字（可留空）" maxlength="80">
  <div>
    <button class="btn btn-primary" id="confirm-name">确认名称</button>
    <button class="btn btn-default" id="keep-01">稍后再说</button>
  </div>
</div>`;

const tutorialHTML = `
<div class="scene-label">02 / 工作说明</div>
<p class="dialogue"><strong>四月：</strong>这里是一个机械人偶店。你的任务是帮来到这里的客人解答关于人偶的任何问题，解释本店的业务，帮助我和客人进行沟通。</p>
<p class="dialogue"><strong>四月：</strong>接下来的几天，我先给你看一些关于推销和营业沟通的书，也给你普及一些人偶知识。这里的其他书籍，如果有你想看的，也可以自己去了解。</p>
<p>四月起身，从旁边飘窗下的柜子里拿出来了一摞书，目测有十几本。</p>
<p class="dialogue"><strong>四月：</strong>今天你先把这几本书看了。看完之后，那边书架上的书都可以随便看。我先去休息，你有什么不懂的，等我起了再问。明天开始，我给你具体讲一下店铺主营业务。</p>
<p>说完，她就通过楼梯去了二楼。</p>
<p>你看着面前的一摞书，不知道这怎么会被称之为“几本”，明明就是很多本。怎么会在一天内看完呢？</p>
<p>不过随即你就想起来了。</p>
<p class="thought">哦，对了，刚才她说我是人偶。人偶的话，会学得快一点吗？那么，什么是人偶？</p>
<p>心中的疑问不会凭空得到解答。</p>
<p>事已至此，先看看书吧。</p>
<p>前面的几本书都是关于营业和推销的。</p>
<p>《如何三句话拿捏客人的心理》《微笑服务》《30分钟教你学会营销》……</p>
<p>由于本来也是要当营业员，你也没挑，只是一本一本读下来。</p>
<p>没多久就看到了最后一本书。</p>
<p><strong>《新时代的产物：机械人偶》</strong></p>
<p>哦！这是我的说明书呢。</p>`;

const manualHTML = `
<h3>ARCHIVE / 书籍记录 001</h3>
<details open>
<summary><strong>《新时代的产物：机械人偶》—— 点击展开书籍内容</strong></summary>
<h3>人偶系统</h3>
<h4>一、系统设置</h4>
<p>人偶系统由两个相互独立的子系统构成：</p>
<ul>
<li><strong>行动系统：</strong>负责驱动人偶躯壳，控制其运动与行为。</li>
<li><strong>语言处理器：</strong>负责语言理解、信息处理与交流。</li>
</ul>
<p>两个子系统分别采用独立的供能机制。</p>
<h4>二、人偶类型</h4>
<p><strong>1. 非自动人偶（主流）</strong></p>
<p><strong>驱动方式：</strong>能源驱动处理器，魔法驱动棉花人偶躯壳。</p>
<p>非自动人偶是目前最主流的人偶类型。其躯壳通常以棉花等柔软材料填充，本身几乎不具备自主行动能力，更接近一个等待外部操控的载体。使用者通过施展魔法控制人偶的活动，而处理器则由能源提供运行所需的动力。</p>
<blockquote>技术背景：在以魔法为主导的世界里，几乎所有人都掌握着操控人偶所需的基础魔法。对于普通玩具而言，使用魔力水晶驱动躯壳的成本过高，因此由使用者直接施法操控，成为更经济、普遍的选择。</blockquote>
<p><strong>2. 全自动人偶（技术门槛高，造价昂贵）</strong></p>
<p><strong>驱动方式：</strong>能源驱动处理器，魔法驱动机械人偶躯壳。</p>
<p>与非自动人偶不同，全自动人偶能够结合语言处理器接收的信息，自主生成相应行为，并通过处理器控制自身行动，无须使用者持续施法操控。</p>
<p>然而，这类人偶的制造成本与技术门槛都远高于非自动人偶。</p>
<blockquote>技术瓶颈：在以魔法为主导的社会中，机械动力技术长期缺乏发展。机械人偶的行动设计往往不够高效，驱动躯壳需要消耗大量能源，因此必须携带更多能源才能维持运作。</blockquote>
<p><strong>进一步的技术发展方向：</strong></p>
<ul>
<li>优化机械结构与行动逻辑，提高能源利用效率。</li>
<li>在完成相同任务的前提下，尽可能降低能源消耗。</li>
<li>减少人偶内部所需携带的能源体积，从而减轻整体重量。</li>
<li>提高续航能力，使机械人偶更加轻便、便携。</li>
</ul>
<h4>三、产业现状与社会影响</h4>
<p>随着人偶产业的飞速发展，越来越多的人偶在外形与细节上高度接近真人，甚至已经达到难以凭外观辨别真伪的程度。</p>
<p>这项技术的进步也带来了新的社会问题。针对人偶的生产、使用及相关管理，目前正处于紧急拟定法规的阶段。</p>
<p><em>随着人偶逐渐融入日常生活，如何界定人偶的功能、使用边界与管理责任，已成为社会亟待解决的问题。</em></p>
</details>`;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showToast(message) {
  toastRoot.innerHTML = `<div class="toast">${escapeHTML(message)}</div>`;
  window.setTimeout(() => {
    toastRoot.innerHTML = "";
  }, 2800);
}

      <div class="choice-card">
        <label class="plant-option">
          <input type="checkbox" name="plants" value="金玲草" ${state.selectedPlants.includes("金玲草") ? "checked" : ""}>

        </label>
        <label class="plant-option">
          <input type="checkbox" name="plants" value="银叶花" ${state.selectedPlants.includes("银叶花") ? "checked" : ""}>

        </label>
        <label class="plant-option">
          <input type="checkbox" name="plants" value="灵蓝草" ${state.selectedPlants.includes("灵蓝草") ? "checked" : ""}>
          灵蓝草
        </label>
      </div>
      <div class="choice-card">
        <p><strong>金玲草</strong> —— 一种常见的观赏植物。</p>
        <p><strong>银叶花</strong> —— 叶片呈银白色，外形优雅。</p>
        <p><strong>灵蓝草</strong> —— 蓝色的叶片中仿佛流动着隐秘的光辉。</p>
      </div>
      <button class="btn btn-primary" id="confirm-plants">确认购买</button>`;
    return;
  }

  if (state.stage === "result") {
    if (!state.lastResult) {
      story.innerHTML = "";
      return;
    }

    story.innerHTML = `
      <div class="scene-label">SHOPPING RESULT / 购买结果</div>
      <p>${escapeHTML(state.lastResult.summary)}</p>
      ${state.lastResult.html}
      <hr>
      <button class="btn btn-default" id="restart-flower">重新选择植物</button>
      <button class="btn btn-primary" id="back-story">返回故事开头</button>`;
  }
}


function showModal(title, bodyHTML, confirmText, onConfirm) {
  modalRoot.innerHTML = `
    <div class="modal-backdrop" role="presentation">
      <div class="modal-dialog">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-header">
            <h3 class="modal-title" id="modal-title">${title}</h3>
          </div>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-footer">
            <button class="btn btn-default" id="modal-close">暂时关闭</button>
            <button class="btn btn-primary" id="modal-confirm">${confirmText}</button>
          </div>
        </div>
      </div>
    </div>`;

  document.getElementById("modal-close").addEventListener("click", () => {
    modalRoot.innerHTML = "";
  });

  document.getElementById("modal-confirm").addEventListener("click", () => {
    modalRoot.innerHTML = "";
    onConfirm();
    render();
  });
}


function openBook(type, title) {
  state.bookType = type;
  state.bookTitle = title;

  if (type === "plants") {
    state.readPlantsBook = true;
  }

  // 读过的书自动加入收藏，避免重复记录
  const alreadyCollected = state.collectedBooks.some(
    book => book.type === type
  );

  if (!alreadyCollected) {
    state.collectedBooks.push({ type, title });
  }

  renderCollectedBooks();

  state.stage = "book";
  render();
}

function goToFlowerRoute() {
  if (!state.readPlantsBook) {
    alert("你还没有读过《植物对于幸福感的影响》，暂时无法开启绿植支线。");
    return;
  }

  state.stage = "flower_route";
  render();
}

function handleStoryClick(event) {
  const button = event.target.closest("button");
  if (!button) return;

  const id = button.id;

  switch (id) {
    case "confirm-name": {
      const input = document.getElementById("name-input");
      const name = input ? input.value.trim() : "";

      if (name.length > 0) {
        state.playerName = name;
        state.named = true;
        state.stage = "naming";
        render();
      } else {
        showToast("如果暂时不想取名，可以点击「稍后再说」。");
      }
      break;
    }

    case "keep-01":
      state.playerName = "01";
      state.named = false;
      state.stage = "tutorial";
      render();
      break;

    case "to-tutorial":
      state.stage = "tutorial";
      render();
      break;

    case "to-manual":
      state.stage = "manual";
      render();
      break;

    case "to-bookshelf":
      state.stage = "bookshelf";
      render();
      break;
      
    case "book-history":
      openBook("history", "《世界史》");

    case "book-magic":
      openBook("magic", "《魔法 × 工业的世界（儿童科普读物）》");
      break;

    case "book-30min":
      openBook("30min", "《30分钟教会你营销》");
      break;

    case "book-smile":
      openBook("smile", "《微笑服务》");
      break;

    case "book-客人":
      openBook("客人", "《如何三句话拿捏客人的心理》");
      break;

    case "book-plants":
      openBook("plants", "《植物对于幸福感的影响》");
      break;

    case "book-language":
      openBook("language", "《语言处理器的使用说明》");
      break;

    case "back-bookshelf":
      state.stage = "bookshelf";
      render();
      break;

    case "to-day2":
      state.storyDay = 2;
      state.stage = "day2";
      render();
      break;

    case "open-quest1":
      showModal(
        "MISSION UPDATE / 主线任务 01",
        `<p>任务目标：请在三天之内完成广告设计以及店铺宣传。</p>
         <p>任务奖励：店面建设度 +10。</p>`,
        "继续营业",
        () => {
          state.stage = "customer";
        }
      );
      break;

    case "open-quest2":
      showModal(
        "MISSION UPDATE / 主线任务 02",
        `<p>任务目标：协助完成叶琳娜的人偶改造需求。</p>`,
        "开始任务",
        () => {
          state.stage = "sidequest";
        }
      );
      break;

    case "to-客人":
      state.stage = "客人";
      render();
      break;

    case "to-sidequest":
      state.stage = "sidequest";
      render();
      break;

    case "to-flower-route":
      goToFlowerRoute();
      break;

    case "ask-florist":
      state.selectedRoute = "florist";
      state.stage = "florist";
      render();
      break;

    case "choose-alone":
      state.selectedRoute = "alone";
      state.stage = "plant_shop";
      render();
      break;

    case "buy-golden":
      /*
       * 保留原 R 代码逻辑：
       * 老板推荐路线会先将金玲草加入购物篮，
       * 然后读者可以再选择第二株半价植物。
       */
      state.selectedPlants = ["金玲草"];
      state.stage = "plant_shop";
      render();
      break;

    case "confirm-plants":
      confirmPlants();
      break;

    case "restart-flower":
      state.stage = "plant_shop";
      render();
      break;

    case "back-story":
      state.stage = "opening";
      state.lastResult = null;
      state.selectedPlants = [];
      render();
      break;

    case "back-bookshelf":
  state.stage = "bookshelf";
  render();
  break;

  efault:
  if (id.startsWith("book-")) {
    const type = id.slice(5);

    if (books[type]) {
      openBook(type, books[type].title);
    }
  }
  break;
  }
}

const utilitySidebar = document.getElementById("utility-sidebar");

document.getElementById("utility-menu-button").addEventListener("click", () => {
  if (utilitySidebar.classList.contains("open")) {
    utilitySidebar.classList.remove("open");
  } else {
    utilitySidebar.classList.add("open");
    renderCollectedBooks();
  }
});


// 修改玩家名字
document.getElementById("save-rename").addEventListener("click", () => {
  const input = document.getElementById("rename-input");
  const newName = input.value.trim();

  if (!newName) {
    alert("请输入一个名字。");
    return;
  }

  state.playerName = newName;
  state.named = newName !== "01";

  render();
  renderCollectedBooks();
  alert("名字已修改！");
});

// 显示已经读过的书
function renderCollectedBooks() {
  const container = document.getElementById("collected-books");

  if (state.collectedBooks.length === 0) {
    container.innerHTML = "<p>还没有读过任何书。</p>";
    return;
  }

  container.innerHTML = state.collectedBooks.map((book, index) => `
    <button type="button" data-book-index="${index}">
      ${escapeHTML(book.title)}
    </button>
  `).join("");
}

// 点击书名，重新阅读
document.getElementById("collected-books").addEventListener("click", event => {
  const button = event.target.closest("[data-book-index]");
  if (!button) return;

  const index = Number(button.dataset.bookIndex);
  const book = state.collectedBooks[index];

  if (book) {
    openBook(book.type, book.title);
    utilitySidebar.classList.remove("open");
  }
});
story.addEventListener("input", (event) => {
  if (event.target.id === "slogan1-input") {
    state.slogan1 = event.target.value;
  }

  if (event.target.id === "slogan2-input") {
    state.slogan2 = event.target.value;
  }

  const preview = document.getElementById("slogan-preview");

  if (preview) {
    const paragraphs = preview.querySelectorAll("p");
    paragraphs[0].textContent = state.slogan1;
    paragraphs[1].textContent = state.slogan2;
  }
});

story.addEventListener("click", (event) => {
  if (event.target.id === "save-slogans") {
  const input1 = document.getElementById("slogan1-input").value.trim();
  const input2 = document.getElementById("slogan2-input").value.trim();

  state.slogan1 = input1 || "本店可为您提供更丰富、便捷的人偶功能。";
  state.slogan2 = input2 || "致力于让每个人都找到更适合自己的人偶伙伴。";

  // 同步更新输入框和预览，显示最终保存的标语
  document.getElementById("slogan1-input").value = state.slogan1;
  document.getElementById("slogan2-input").value = state.slogan2;

  const preview = document.getElementById("slogan-preview");
  if (preview) {
    const paragraphs = preview.querySelectorAll("p");
    paragraphs[0].textContent = state.slogan1;
    paragraphs[1].textContent = state.slogan2;
  }

  showToast("标语已保存！");
}
});
story.addEventListener("click", handleStoryClick);


// 资料栏：打开书架覆盖层
document.getElementById("back-to-bookshelf").addEventListener("click", () => {
  utilitySidebar.classList.remove("open");

  // 显示叠层书架
  function showOverlayBookshelf() {
    modalRoot.innerHTML = `
      <div class="bookshelf-overlay">
        <div class="bookshelf-window">
          <button id="close-bookshelf" class="bookshelf-close">关闭 ×</button>

          <div class="scene-label">ARCHIVE / 书架</div>
          <p>你发现自己看过的书都会自动储存在脑子里，可以随时在脑海中调用和重新阅读其中的内容。刚才的内容看了一知半解，或许需要多看几本才能彻底理解这个世界。</p>
          <p>现在也没什么其他事情干，看看书架上还有什么有用的书籍吧。</p>

          <h4>请选择想阅读的书籍</h4>
          <div class="choice-card">
            ${Object.entries(books).map(([type, book]) => `
              <button class="btn btn-default" data-overlay-book="${type}">
                ${escapeHTML(book.title)}
              </button>
            `).join("")}
          </div>

          ${state.readPlantsBook
            ? `<p class="status">阅读记录：你读过《植物对于幸福感的影响》。后续可以触发买花支线。</p>`
            : ""}
        </div>
      </div>
    `;

    document.getElementById("close-bookshelf").addEventListener("click", () => {
      modalRoot.innerHTML = "";
    });

    modalRoot.querySelectorAll("[data-overlay-book]").forEach(button => {
      button.addEventListener("click", () => {
        const type = button.dataset.overlayBook;
        const book = books[type];
        if (!book) return;

        // 更新阅读记录，但不调用原来的 openBook()
        state.bookType = type;
        state.bookTitle = book.title;

        if (type === "plants") {
          state.readPlantsBook = true;
        }

        const alreadyCollected = state.collectedBooks.some(
          item => item.type === type
        );

        if (!alreadyCollected) {
          state.collectedBooks.push({ type, title: book.title });
        }

        renderCollectedBooks();

        // 在同一个叠层里显示书籍
        modalRoot.innerHTML = `
          <div class="bookshelf-overlay">
            <div class="bookshelf-window">
              <button id="close-bookshelf" class="bookshelf-close">关闭 ×</button>
              <div class="scene-label">ARCHIVE / ${escapeHTML(book.title)}</div>
              ${book.content}
              <button class="btn btn-primary" id="overlay-back-bookshelf">
                返回书架
              </button>
            </div>
          </div>
        `;

        document.getElementById("close-bookshelf").addEventListener("click", () => {
          modalRoot.innerHTML = "";
        });

        document.getElementById("overlay-back-bookshelf").addEventListener("click", () => {
          showOverlayBookshelf();
        });
      });
    });
  }

  showOverlayBookshelf();
});
